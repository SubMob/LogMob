[versions]

kotlin = "2.3.10"
androidGradlePlugin = "8.13.2"
firebaseBom = "34.11.0"
anrWatchDog = "1.4.0"
kermit = "2.0.8"

[libraries]
# COMMON
common-kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
common-kermitCrashlytics = { module = "co.touchlab:kermit-crashlytics", version.ref = "kermit" }

# ANDROID
android-firebaseBom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
android-firebaseCrashlytics = { module = "com.google.firebase:firebase-crashlytics" }
android-anrWatchDog = { module = "com.github.anrwatchdog:anrwatchdog", version.ref = "anrWatchDog" }

[plugins]

kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidLibrary = { id = "com.android.library", version.ref = "androidGradlePlugin" }
